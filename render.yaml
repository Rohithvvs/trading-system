services:
  - type: web
    name: trading-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: |
      alembic -c backend/alembic.ini upgrade head &&
      python backend/scripts/import_stocks_master.py ind_nifty500list.csv NIFTY500 || echo "Stocks master import completed (or skipped if no DB access / already populated)"
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
