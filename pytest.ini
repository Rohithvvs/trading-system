[pytest]
pythonpath = . backend
# Prefer backend/tests as the canonical suite. Root tests/ still collected for
# non-ACS modules (token, alembic); ACS root stubs are kept in sync with backend.
testpaths = backend/tests tests
addopts = -ra --strict-markers --log-file=tests/artifacts/backend/pytest.log --log-file-level=INFO
markers =
    unit: small deterministic tests for pure functions and narrow services
    integration: tests that exercise FastAPI routes, database writes, or several components together
    live: tests that call real external services such as FYERS; skipped unless explicitly selected
    slow: tests expected to take noticeably longer than the fast suite
    asyncio: mark test as async
    concurrency: tests targeting race conditions, thread locking, and overlap
    soak: long running resilience tests
    recovery: mark test as recovery and restart safety test
asyncio_mode = auto
