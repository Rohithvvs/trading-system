[alembic]
# Canonical migration tree lives under backend/alembic (same graph used by
# backend/alembic.ini and render preDeploy). The historical root-level
# alembic/versions/ tree is retired to prevent dual-graph failures such as:
#   Can't locate revision identified by '20260723_widen_reason_codes'
# when alembic is invoked from the repo root against a backend-stamped DB.
script_location = %(here)s/backend/alembic
prepend_sys_path = .
# URL is overridden at runtime by backend/alembic/env.py from app settings.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

